<style>
:root{--ink:#0f2a44;--paper:#fffaf0;--gold:#ffcf3a;--gold2:#c9901a;--sky:#4fb3ff;--red:#ff5a4f;--muted:#cfe2f3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ink)}
body{margin:0;min-height:100vh;color-scheme:dark;color:var(--paper);font-family:'Gowun Dodum',sans-serif;background:var(--ink);
  background-image:radial-gradient(120% 70% at 50% 0%,#1d5585,var(--ink) 70%);padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent}
.bar,#wrap,.info{width:min(100%,1180px,calc((100vh - 190px) * 16 / 9));min-width:min(100%,320px)}
@supports (height:100dvh){.bar,#wrap,.info{width:min(100%,1180px,calc((100dvh - 190px) * 16 / 9))}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h1{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(22px,3.2vw,34px);margin:0;color:var(--gold);white-space:nowrap}
.bar h1 small{font-family:'Gowun Dodum',sans-serif;font-size:.45em;color:var(--muted);letter-spacing:.1em;margin-left:.6em;vertical-align:middle}
.home{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;margin-right:.3em;border-radius:50%;background:rgba(255,250,240,.12);color:var(--paper);text-decoration:none;font-size:.8em;vertical-align:middle}
.tbtn{font:inherit;font-size:13px;color:var(--paper);background:rgba(255,250,240,.08);border:1px solid rgba(255,250,240,.25);border-radius:999px;padding:6px 12px;cursor:pointer}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;font-size:14px;line-height:1.65;color:var(--muted)}
.info h3{margin:0 0 4px;font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:var(--gold)}
.info b{color:var(--paper);font-weight:400}
@media (max-width:720px){.info{grid-template-columns:1fr}}
#wrap{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;container-type:size;background:#000;touch-action:none;
  box-shadow:0 0 0 6px #1d5585,0 0 0 8px rgba(255,207,58,.4),0 24px 60px rgba(0,0,0,.5);-webkit-user-select:none;user-select:none}
body.playing{padding:0;overflow:hidden}
body.playing .bar,body.playing .info{display:none}
body.playing #wrap{position:fixed;inset:0;margin:auto;width:min(100vw,calc(100vh * 16 / 9));height:auto;border-radius:0;box-shadow:none}
@supports (height:100dvh){body.playing #wrap{width:min(100vw,calc(100dvh * 16 / 9))}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center;z-index:5;background:rgba(8,24,40,.62);backdrop-filter:blur(2px)}
.ov h2{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:6cqw;color:var(--gold);text-shadow:0 .5cqw 0 #0b2238}
.ov h3{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:3.6cqw;color:var(--gold);text-shadow:0 .35cqw 0 #0b2238}
.ov p{margin:0;font-size:2.1cqw;line-height:1.6;max-width:72cqw;word-break:keep-all}
.ov .eyebrow{font-size:1.7cqw;letter-spacing:.3em;color:var(--muted)}
.row{display:flex;gap:1.4cqw;flex-wrap:wrap;justify-content:center}
.btn{font-family:'Jua',sans-serif;font-size:2.4cqw;border:0;border-radius:999px;padding:1cqw 3cqw;background:var(--gold);color:#3a230f;box-shadow:0 .5cqw 0 var(--gold2);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:rgba(255,250,240,.1);color:var(--paper);box-shadow:inset 0 0 0 .22cqw rgba(255,250,240,.5)}
.btn.sm{font-size:1.8cqw;padding:.7cqw 2cqw}
.card{background:rgba(255,250,240,.96);color:#1c2b3a;border-radius:2cqw;padding:2cqw 3cqw;max-width:74cqw;box-shadow:0 1.6cqw 4cqw rgba(0,0,0,.45)}
.card h3{color:#d0482f;text-shadow:none}
.card p{font-size:2cqw}
.card .keys{font-size:1.6cqw;color:#55697d;margin-top:.6cqw}
.card img{height:10cqw}
.evlist{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw;max-width:86cqw}
.evlist button{font:inherit;color:var(--paper);background:rgba(255,250,240,.1);border:.2cqw solid rgba(255,250,240,.35);border-radius:1.4cqw;padding:1cqw .6cqw;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4cqw}
.evlist button img{height:7cqw;object-fit:contain}
.evlist button b{font-family:'Jua',sans-serif;font-weight:400;font-size:1.8cqw}
.evlist button small{font-size:1.3cqw;color:var(--muted)}
.mode{display:flex;gap:2cqw}
.mode button{font:inherit;color:var(--paper);background:rgba(255,250,240,.1);border:.25cqw solid rgba(255,250,240,.35);border-radius:1.6cqw;padding:1.4cqw 2.4cqw;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.6cqw;min-width:26cqw}
.mode button.on{border-color:var(--gold);background:rgba(255,207,58,.18)}
.mode button .faces{display:flex;align-items:flex-end;gap:.6cqw}
.mode button .faces img{height:9cqw}
.mode button b{font-family:'Jua',sans-serif;font-weight:400;font-size:2.3cqw}
.mode button small{font-size:1.45cqw;color:var(--muted)}
.score{display:grid;grid-template-columns:auto 1fr 1fr;gap:.5cqw 2cqw;font-size:1.9cqw;align-items:center;background:rgba(255,250,240,.95);color:#1c2b3a;border-radius:1.6cqw;padding:1.4cqw 2.4cqw}
.score .h{font-family:'Jua',sans-serif;color:#d0482f}
.score .w{font-weight:700;color:#0f7a3c}
.coupon{display:flex;gap:1.4cqw;align-items:center;background:#fff3c4;color:#3a230f;border-radius:1.2cqw;padding:.8cqw 1.6cqw;font-size:1.7cqw}
.coupon b{font-family:'Jua',sans-serif;font-weight:400;font-size:1.9cqw}
.coupon code{margin-left:auto;font-size:1.5cqw;background:#3a230f;color:var(--gold);padding:.2cqw .8cqw;border-radius:.6cqw}
#hud{position:absolute;left:50%;transform:translateX(-50%);bottom:1cqw;display:flex;gap:.8cqw;z-index:4}
#hud button{font-family:'Jua',sans-serif;font-size:1.7cqw;color:var(--paper);background:rgba(8,24,40,.6);border:.15cqw solid rgba(255,250,240,.45);border-radius:999px;padding:.4cqw 1.3cqw;cursor:pointer}
</style>

<body>
<div class="bar">
  <h1><a class="home" href="../" aria-label="수호런 홈">⌂</a>수호 올림픽<small>부산진구 아케이드 · 연타 대결</small></h1>
  <div><button class="tbtn" id="fsBtn">⛶ 전체 화면</button></div>
</div>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="hud" hidden><button id="bgmBtn">🔊 음악</button><button id="quitBtn">✕ 그만하기</button></div>
  <div id="ov" class="ov"></div>
</div>
<div class="info">
  <div><h3>어떻게 하나요</h3>5종목을 차례로 겨뤄요. <b>혼자</b>면 볼트와, <b>둘이</b>면 휴대폰 하나를 가운데 두고 <b>왼쪽 절반은 수호, 오른쪽 절반은 볼트</b>가 눌러요. 키보드는 수호 <b>A·D</b>, 볼트 <b>←·→</b>(혼자일 때는 둘 다 수호).</div>
  <div><h3>종목</h3>서면 100m 달리기 · 부전시장 어묵 꼬치 · 국밥골목 토렴 · 시민공원 볼트 풍선 · 시민공원 원반 던지기. 금메달을 모으면 가게 쿠폰을 받아요(시연용 가상 가게).</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const SITE_ID='olympic',W=window.SuhoWallet||null,BEST='olympic.best.v1';
const cv=$('cv'),cx=cv.getContext('2d'),CW=1280,CH=720;
const I={};const SRC={bg_track:'img/bg_track.jpg',bg_eomuk:'img/bg_eomuk.jpg',bg_park:'img/bg_park.jpg',bg_podium:'img/bg_podium.jpg',bg_kitchen:'../gukbap/img/bg_kitchen.jpg?v=2',
  s_wind:'img/s_wind.png',s_throw:'img/s_throw.png',s_skewer:'img/s_skewer.png',s_torryeom:'img/s_torryeom.png',s_cheer:'img/s_cheer.png',s_tired:'img/s_tired.png',
  p_piece:'img/p_piece.png',p_stick:'img/p_stick.png',p_skewer:'img/p_skewer.png',p_bowl:'img/p_bowl.png',p_ladle:'img/p_ladle.png',p_balloon:'img/p_balloon.png',p_balloon_red:'img/p_balloon_red.png',p_disc:'img/p_disc.png',
  m_gold:'img/m_gold.png',m_silver:'img/m_silver.png',m_bronze:'img/m_bronze.png',m_trophy:'img/m_trophy.png',hero:'../common/sprites/g_hero.png',bot:'../common/sprites/bot_a.png',botH:'../common/sprites/bot_happy.png',botZ:'../common/sprites/bot_zap_a.png'};
for(let i=1;i<=8;i++)SRC['run'+i]='../common/sprites/g_run'+i+'.png';
const loaded=Promise.all(Object.entries(SRC).map(([k,s])=>new Promise(r=>{const im=new Image();im.onload=()=>{I[k]=im;r()};im.onerror=r;im.src=s})));
function bg(k){const im=I[k];if(im)cx.drawImage(im,0,0,CW,CH);else{cx.fillStyle='#4fb3ff';cx.fillRect(0,0,CW,CH)}}
function spr(k,x,yb,h,flip,rot,alpha){const im=I[k];if(!im)return;const w=im.width*h/im.height;cx.save();cx.translate(x,yb);if(rot)cx.rotate(rot);if(flip)cx.scale(-1,1);if(alpha!=null)cx.globalAlpha=alpha;cx.drawImage(im,-w/2,-h,w,h);cx.restore()}
function txt(t,x,y,size,col,align,stroke){cx.font=`${size}px Jua, sans-serif`;cx.textAlign=align||'center';cx.textBaseline='middle';cx.lineJoin='round';
  cx.lineWidth=stroke==null?size*.18:stroke;cx.strokeStyle='rgba(10,25,40,.9)';if(cx.lineWidth)cx.strokeText(t,x,y);cx.fillStyle=col||'#fff';cx.fillText(t,x,y)}
function panel(x,y,w,h,a){cx.fillStyle=`rgba(10,30,50,${a||.55})`;rr(x,y,w,h,18);cx.fill()}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}

/* ---------- 소리 ---------- */
let AC=null;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function beep(f,d,v,type,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SFX={tap:()=>beep(520+Math.random()*80,.05,.05),good:()=>{beep(660,.08,.09);beep(990,.12,.08,'triangle',.07)},bad:()=>beep(160,.18,.1,'square'),
  pop:()=>{const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*.25,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=a.createBufferSource(),g=a.createGain();g.gain.value=.35;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()},
  go:()=>{beep(880,.25,.12,'square')},count:()=>beep(440,.12,.1,'square'),
  fan:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.22,.1,'triangle',i*.12)),whistle:()=>{beep(2100,.3,.06,'sine');beep(2300,.3,.05,'sine',.05)}};
/* 배경음악: 밝고 가벼운 운동회 리듬 */
const BGM={on:true,t:null,next:0,step:0};try{BGM.on=localStorage.getItem('olympic.bgm')!=='off'}catch(e){}
const MEL=[72,76,79,76,74,77,81,77,72,76,79,84,83,79,74,79],BAS=[48,48,53,53,43,43,48,48];
const mf=m=>440*Math.pow(2,(m-69)/12);
function bgmTick(){const a=AC;if(!a||!BGM.on)return;const e=60/132/2;while(BGM.next<a.currentTime+.25){const t=BGM.next,s=BGM.step++;
  const n=(f,d,v,ty)=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)};
  if(s%2===0)n(mf(MEL[(s/2)%16]),e*1.6,.028,'square');if(s%4===0)n(mf(BAS[(s/4)%8]),e*3,.05,'triangle');if(s%4===2)n(3000,.02,.012,'square');BGM.next+=e}}
function bgmStart(){if(!ac())return;if(!BGM.t){BGM.next=AC.currentTime+.1;BGM.t=setInterval(bgmTick,90)}}
$('bgmBtn').onclick=e=>{e.stopPropagation();BGM.on=!BGM.on;try{localStorage.setItem('olympic.bgm',BGM.on?'on':'off')}catch(er){}$('bgmBtn').textContent=BGM.on?'🔊 음악':'🔇 음악';if(BGM.on){BGM.next=AC?AC.currentTime+.1:0;bgmStart()}};

/* ---------- 입력: 화면 왼쪽/오른쪽, 2인이면 반쪽씩 ---------- */
let MODE=1;   // 1=볼트와 대결(컴퓨터), 2=둘이서
const held=[0,0];const ptr=new Map();let EV=null;
function where(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  if(MODE===2){const p=x<.5?0:1,side=((p===0?x:x-.5)<.25)?'L':'R';return {p,side}}return {p:0,side:x<.5?'L':'R'}}
$('wrap').addEventListener('pointerdown',e=>{if(e.target!==cv)return;e.preventDefault();ac();const w=where(e);ptr.set(e.pointerId,w.p);held[w.p]++;if(EV&&EV.live)EV.input(w.p,w.side,'down')},{passive:false});
const up=e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);ptr.delete(e.pointerId);held[p]=Math.max(0,held[p]-1);if(EV&&EV.live)EV.input(p,'',  'up')};
$('wrap').addEventListener('pointerup',up);$('wrap').addEventListener('pointercancel',up);
const KEYS={KeyA:[0,'L'],KeyD:[0,'R'],ArrowLeft:[1,'L'],ArrowRight:[1,'R'],Space:[0,'L'],KeyF:[0,'L'],KeyJ:[1,'L'],KeyL:[1,'R']};
const kdown=new Set();
addEventListener('keydown',e=>{const k=KEYS[e.code];if(!k)return;e.preventDefault();if(kdown.has(e.code))return;kdown.add(e.code);let [p,s]=k;if(MODE===1)p=0;held[p]++;if(EV&&EV.live)EV.input(p,s,'down')});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(!k||!kdown.has(e.code))return;kdown.delete(e.code);let [p]=k;if(MODE===1)p=0;held[p]=Math.max(0,held[p]-1);if(EV&&EV.live)EV.input(p,'','up')});

/* ---------- 선수 ---------- */
const NAMES=()=>MODE===2?['수호','볼트']:['수호','볼트(컴퓨터)'];
function drawBolt(x,yb,h,t,k){spr(k||'bot',x,yb-Math.sin(t*6)*h*.05,h)}
function sideHint(p,y){if(MODE!==2)return;const x0=p===0?0:CW/2;cx.fillStyle='rgba(255,255,255,.05)';cx.fillRect(x0,0,CW/2,CH);
  cx.strokeStyle='rgba(255,255,255,.25)';cx.setLineDash([10,10]);cx.lineWidth=3;cx.beginPath();cx.moveTo(CW/2,0);cx.lineTo(CW/2,CH);cx.stroke();cx.setLineDash([])}
function tapPads(p,label){// 연타 종목: 눌러야 할 칸 표시
  const n=MODE===2?2:1,base=MODE===2?(p===0?0:CW/2):0,w=MODE===2?CW/2:CW;const hl=EV.want?EV.want[p]:'';
  ['L','R'].forEach((s,i)=>{const x=base+(i?w*3/4:w/4),y=CH-58;cx.globalAlpha=hl===s?1:.35;panel(x-70,y-38,140,76,.7);cx.globalAlpha=1;
    txt(s==='L'?(MODE===2?(p?'←':'A'):'왼쪽'):(MODE===2?(p?'→':'D'):'오른쪽'),x,y,30,hl===s?'#ffcf3a':'#fff')})}

/* ---------- 종목 ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
function alternate(ev,p,side,ok){// 좌우 번갈아 누르기 공통
  if(!side)return;if(ev.last[p]===side){ev.bad&&ev.bad(p);return}ev.last[p]=side;ev.want[p]=side==='L'?'R':'L';SFX.tap();ok(p)}
const EVENTS=[
{id:'run',name:'서면 100m 달리기',place:'서면 1번가',icon:'run3',how:'화면 <b>왼쪽·오른쪽을 번갈아</b> 빠르게 누르면 수호가 달려요. 같은 쪽을 두 번 누르면 휘청!',unit:'초',better:'low',
 make(){return {x:[0,0],v:[0,0],last:['',''],want:['L','L'],fin:[0,0],t:0,anim:[0,0],cpuT:0,
  input(p,s,ty){if(ty!=='down')return;alternate(this,p,s,q=>{this.v[q]=Math.min(12.5,this.v[q]+1.15)})},
  bad(p){this.v[p]*=.55;SFX.bad()},
  update(dt){this.t+=dt;if(MODE===1){this.cpuT-=dt;if(this.cpuT<=0){this.cpuT=1/rnd(6.6,8.4);this.v[1]=Math.min(12.5,this.v[1]+1.15)}}
   for(const p of [0,1]){if(this.fin[p])continue;this.v[p]*=Math.exp(-1.2*dt);this.x[p]+=this.v[p]*dt;this.anim[p]+=this.v[p]*dt*1.1;if(this.x[p]>=100){this.x[p]=100;this.fin[p]=+this.t.toFixed(2);SFX.whistle()}}
   if(this.fin[0]&&this.fin[1])return [this.fin[0],this.fin[1]];if(this.t>40)return [this.fin[0]||40,this.fin[1]||40]},
  draw(){bg('bg_track');const X=m=>110+m*10.5;
   const fy=[700,632];
   for(const p of [1,0]){const x=X(this.x[p]);if(p===0){const f=1+Math.floor(this.anim[0]*1.2)%8;spr(this.fin[0]?'s_cheer':(this.v[0]<.4?'hero':'run'+f),x,fy[0],168)}
     else drawBolt(x,fy[1]-10,118,this.t,this.fin[1]?'botH':(this.v[1]>8?'botZ':'bot'))}
   panel(20,20,420,92);for(const p of [0,1]){txt(NAMES()[p],40,48+p*38,26,p?'#7fe9ff':'#ffcf3a','left');txt(this.fin[p]?this.fin[p].toFixed(2)+'초 도착!':Math.floor(this.x[p])+'m',420,48+p*38,26,'#fff','right')}
   txt(this.t.toFixed(1)+'초',CW/2,60,40,'#fff');tapPads(0);if(MODE===2)tapPads(1)}}}},
{id:'eomuk',name:'부전시장 어묵 꼬치',place:'부전시장',icon:'p_skewer',how:'<b>왼쪽·오른쪽을 번갈아</b> 눌러 어묵을 꼬치에 꽂아요. 다섯 번에 한 장, 다섯 장이면 꼬치 하나! 15초 동안 몇 개?',unit:'개',better:'high',
 make(){return {n:[0,0],last:['',''],want:['L','L'],t:15,cpuT:0,shake:[0,0],
  input(p,s,ty){if(ty!=='down')return;alternate(this,p,s,q=>{this.n[q]++;if(this.n[q]%5===0){this.shake[q]=.15;if(this.n[q]%25===0)SFX.good()}})},
  bad(p){this.shake[p]=.2},

let QUEUE=[],RESULTS=[],last=0,cd=0,run=null,practice=false;
function ov(html){const o=$('ov');o.hidden=false;o.innerHTML=html;return o}
function hideOv(){$('ov').hidden=true}
function title(){EV=null;document.body.classList.remove('playing');$('hud').hidden=true;
  ov(`<div class="eyebrow">SUHO RUN · ARCADE</div><h2>수호 올림픽</h2><p>서면, 부전시장, 국밥골목, 시민공원에서 펼쳐지는 다섯 종목 연타 대결! 혼자서 볼트와 겨루거나, 휴대폰 하나로 둘이 대결해요.</p>
   <div class="mode"><button data-m="1" class="${MODE===1?'on':''}"><span class="faces"><img src="${SRC.hero}" alt=""><img src="${SRC.bot}" alt=""></span><b>혼자 하기</b><small>볼트(컴퓨터)와 대결</small></button>

}
function pickEvent(){ov(`<h3>연습할 종목 고르기</h3><div class="evlist">${EVENTS.map((e,i)=>`<button data-i="${i}"><img src="${SRC[e.icon]}" alt=""><b>${e.name.split(' ').slice(1).join(' ')}</b><small>${e.place}</small></button>`).join('')}</div><button class="btn ghost sm" id="bk">← 돌아가기</button>`);
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{practice=true;QUEUE=[+b.dataset.i];RESULTS=[];next()});$('bk').onclick=title}
function next(){ac();bgmStart();if(!QUEUE.length){final();return}const i=QUEUE.shift(),e=EVENTS[i];document.body.classList.add('playing');$('hud').hidden=false;
  EV=null;drawIdle(e);

   <div class="keys">${MODE===2?'둘이 하기: 왼쪽 절반은 수호(A·D), 오른쪽 절반은 볼트(←·→)':'혼자 하기: 화면 왼쪽/오른쪽 또는 A·D 키'}</div></div><button class="btn" id="ready">준비 완료!</button>`);
  $('ready').onclick=()=>{hideOv();EV=e.make();EV.def=e;EV.live=false;held[0]=held[1]=0;cd=3.2;SFX.count()}}
function drawIdle(e){const k={run:'bg_track',eomuk:'bg_eomuk',torryeom:'bg_kitchen',balloon:'bg_park',disc:'bg_park'}[e.id];bg(k)}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(EV){if(cd>0){const before=Math.ceil(cd);cd-=dt;const now=Math.ceil(cd);EV.draw();txt(cd>.4?now-0+'':'시작!',CW/2,CH/2,cd>.4?160:130,'#ffcf3a',null,18);if(now!==before&&now>0)SFX.count();if(cd<=0){EV.live=true;SFX.go()}}
   else if(EV.live){const r=EV.update(dt);EV.draw();if(r){EV.live=false;const ev=EV;setTimeout(()=>result(ev,r),600)}}

function final(){EV=null;$('hud').hidden=true;const g=[0,0];RESULTS.forEach(x=>{if(x.w<0){g[0]++;g[1]++}else g[x.w]++});const N=NAMES();
  const top=g[0]===g[1]?-1:(g[0]>g[1]?0:1);

  put(order[0],pod[0]);put(order[1],top<0?pod[1]:pod[1],order[1]===0?'hero':'bot');
  spr('m_trophy',760,330,90);
  let cp='';
  if(W&&!practice){const golds=g[0];const got=[];const st=['수호분식','부전시장 어묵집','시민공원 매점'];
    if(golds>=1)got.push(W.issue(SITE_ID,st[0]));if(golds>=3)got.push(W.issue(SITE_ID,st[1]));if(golds>=5){got.push(W.issue(SITE_ID,st[2]));got.push(W.issue(SITE_ID,'수호 올림픽 조직위'))}
    try{const k='bjrun.stamps.s1-olympic',stp=JSON.parse(localStorage.getItem(k))||{got:{},boss:{}};got.filter(Boolean).forEach(x=>stp.got[x.coupon.store]=1);if(golds>=5)stp.boss['5']=1;localStorage.setItem(k,JSON.stringify(stp))}catch(x){}
    cp=got.filter(Boolean).map(x=>`<div class="coupon"><b>${x.coupon.store}</b> ${x.coupon.benefit}<code>${x.coupon.code}</code></div>`).join('');
    W.logPlay(SITE_ID,{score:golds,stage:5,clear:true,stores:3})}

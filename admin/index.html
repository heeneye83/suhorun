<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>쿠폰 관리 · 수호런 운영자</title>
<link rel="icon" href="../common/sprites/bot_happy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../common/suho.css">
<script src="../common/sites.js"></script>
<script src="../common/wallet.js"></script>
<style>
h1{font-size:30px;margin:2px 0 4px}
.sub{color:var(--muted);font-size:14px}
.gate{max-width:380px;margin:12vh auto 0;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate img{height:80px;margin:0 auto}
.gate .err{color:#ffb4a2;font-size:14px;min-height:1.3em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 14px}
.bar select{width:auto}
.bar .sp{flex:1}
.note{padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}
.note.sample{background:rgba(255,220,102,.14);border:1px solid rgba(255,220,102,.45)}
.note.local{background:rgba(255,246,224,.06);border:1px solid var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:32px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
section{margin-bottom:26px}
section h2{font-size:21px;color:var(--yellow);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
section h2 .sp{flex:1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--faint);background:var(--panel)}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--faint);white-space:nowrap}
.tbl th{font-weight:400;color:var(--muted);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.n{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:.05em}
.rate{display:flex;align-items:center;gap:8px;min-width:150px}
.rate .track{flex:1;height:8px;border-radius:999px;background:var(--faint);overflow:hidden}
.rate .track i{display:block;height:100%;border-radius:999px;background:var(--mint)}
.rate span{font-variant-numeric:tabular-nums;width:3.2em;text-align:right;font-size:13px}
.pin{font-family:ui-monospace,Menlo,monospace;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0}
.lookup{display:flex;gap:10px;flex-wrap:wrap}
.lookup input{flex:1;min-width:200px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.lres{margin-top:10px;font-size:14px}
.how{padding:16px 18px;font-size:14px;color:var(--muted);line-height:1.75}
.how b{color:var(--cream);font-weight:400;font-family:var(--display)}
.how ol{margin:6px 0 0;padding-left:20px}
.empty{color:var(--muted);font-size:14px;padding:16px}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topbar"><a class="home" href="../"><img src="../common/sprites/bot_a.png" alt="">수호런 홈</a><span class="chip">운영자 화면</span></nav>

  <form class="gate card" id="gate" hidden>
    <img src="../common/sprites/bot_blink.png" alt="">
    <h1 style="font-size:24px">운영자 확인</h1>
    <p class="sub">쿠폰·응모 관리 화면이에요. 운영자 비밀번호를 넣어 주세요.</p>
    <input type="password" id="pw" autocomplete="current-password" aria-label="운영자 비밀번호" placeholder="비밀번호">
    <p class="err" id="gerr" role="alert"></p>
    <button class="btn" type="submit">들어가기</button>
    <p class="sub" style="font-size:12px">시연용 비밀번호: suho2026</p>
  </form>

  <main id="app" hidden>
    <h1>쿠폰 관리</h1>
    <p class="sub">모든 명소 게임의 쿠폰 발급·사용과 경품 응모를 한곳에서 봐요.</p>
    <div class="bar">
      <select id="fsite" aria-label="명소"></select>
      <select id="fseason" aria-label="시즌"></select>
      <span class="sp"></span>
      <button class="btn small ghost" id="sample" type="button">시연용 샘플 데이터 보기</button>
      <button class="btn small ghost" id="reload" type="button">새로고침</button>
    </div>
    <div id="srcnote"></div>
    <div class="kpis" id="kpis"></div>

    <section>
      <h2>가게별 쿠폰<span class="sp"></span><button class="btn small ghost" id="csvC" type="button">쿠폰 목록 내려받기(CSV)</button></h2>
      <div class="tw"><table class="tbl" id="stores"></table></div>
    </section>

    <section>
      <h2>쿠폰 조회</h2>
      <div class="card" style="padding:16px">
        <form class="lookup" id="lkf"><input id="lk" type="search" placeholder="쿠폰 번호 (예: JP-AB12-CD34)" aria-label="쿠폰 번호"><button class="btn small" type="submit">조회</button></form>
        <div class="lres" id="lres"></div>
      </div>
    </section>

    <section>
      <h2>쿠폰북 추첨 응모자<span class="sp"></span><button class="btn small ghost" id="unmask" type="button">연락처 전체 보기</button><button class="btn small ghost" id="csvE" type="button">응모자 내려받기(CSV)</button></h2>
      <div class="tw"><table class="tbl" id="entries"></table></div>
    </section>

    <section>
      <h2>쿠폰북 추첨<span class="sp"></span><button class="btn small ghost" id="csvW" type="button" hidden>당첨자 내려받기(CSV)</button></h2>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
        <p class="sub" id="drawInfo"></p>
        <div class="lookup"><label class="sub" for="nWin" style="align-self:center">당첨 인원</label><input id="nWin" type="number" min="1" style="max-width:110px;font-family:inherit;text-transform:none">
          <button class="btn small" id="doDraw" type="button">추첨하기</button><button class="btn small ghost" id="clrDraw" type="button" hidden>추첨 결과 지우기</button></div>
        <div id="drawRes"></div>
      </div>
    </section>

    <section>
      <h2>정식 운영 연결</h2>
      <div class="card how" id="how"></div>
    </section>
  </main>
  <p class="foot">개인정보(이름·연락처)는 경품 발송 목적으로만 쓰고 이벤트 종료 후 파기해요. 내려받은 파일도 같은 기준으로 관리해 주세요.</p>
</div>

<script>
(function(){
  const W=window.SUHO,WL=window.SuhoWallet,$=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>Number(n||0).toLocaleString('ko-KR');
  const SITES=W.sites,siteOf=id=>SITES.find(s=>s.id===id);
  const DEMO_PW='suho2026';   // 시연용. 정식 운영에서는 서버(관리자 키)로 확인
  let DATA={coupons:[],entries:[],plays:[]},SAMPLE=false,UNMASK=false,MORE=false;

  // ---------- 들어가기 ----------
  const ok=()=>{try{return sessionStorage.getItem('suho.admin')==='1'}catch(e){return false}};
  function enter(){$('gate').hidden=true;$('app').hidden=false;init()}
  if(ok())enter();else{$('gate').hidden=false;setTimeout(()=>$('pw').focus(),50)}
  $('gate').onsubmit=e=>{e.preventDefault();const v=$('pw').value;
    if(W.endpoint){try{sessionStorage.setItem('suho.key',v)}catch(_){}}
    if(W.endpoint||v===DEMO_PW){try{sessionStorage.setItem('suho.admin','1')}catch(_){}enter()}else{$('gerr').textContent='비밀번호가 맞지 않아요.'}};

  // ---------- 데이터 ----------
  function load(){
    if(SAMPLE)return Promise.resolve(sample());
    if(W.endpoint){let key='';try{key=sessionStorage.getItem('suho.key')||''}catch(e){}
      return fetch(`${W.endpoint}?type=all&key=${encodeURIComponent(key)}`).then(r=>r.json()).then(d=>{if(!d.ok)throw new Error(d.msg||'불러오기 실패');return d})
        .catch(err=>{note(`서버에서 불러오지 못했어요: ${esc(err.message)} · 이 기기 데이터를 대신 보여 줘요.`,'sample');return WL.raw()})}
    return Promise.resolve(WL.raw());
  }
  function sample(){   // 화면 시연용 가짜 기록 (실제 기록 아님)
    const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),d={coupons:[],entries:[],plays:[]};const site=siteOf('jeonpo'),now=Date.now();
    const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=()=>'JP-'+[0,0].map(()=>Array.from({length:4},()=>ABC[rnd(0,31)]).join('')).join('-');
    const weight=[1,.86,.74,.62,.55,.47];
    for(let i=0;i<1240;i++){const t=new Date(now-rnd(0,20*864e5)).toISOString();d.plays.push({site:'jeonpo',season:site.season.id,score:rnd(300,26000),stage:rnd(1,3),clear:Math.random()<.18,at:t})}
    site.stores.forEach((st,i)=>{const n=Math.round(rnd(150,175)*weight[i]);for(let k=0;k<n;k++){const t=now-rnd(0,20*864e5);
      d.coupons.push({code:code(),site:'jeonpo',season:site.season.id,store:st.name,benefit:st.benefit,color:st.color,issuedAt:new Date(t).toISOString(),usedAt:Math.random()<.32+.06*(5-i)/5?new Date(t+rnd(1,4)*864e5).toISOString():null})}});
    for(let i=0;i<87;i++)d.entries.push({id:'S'+i,site:'jeonpo',season:site.season.id,name:`시연${String(i+1).padStart(2,'0')}`,phone:`0100000${String(i).padStart(4,'0')}`,at:new Date(now-rnd(0,15*864e5)).toISOString()});
    return d;
  }
  function note(html,cls){$('srcnote').innerHTML=html?`<div class="note ${cls||'local'}">${html}</div>`:''}

  // ---------- 필터 ----------
  function initFilters(){
    $('fsite').innerHTML='<option value="">모든 명소</option>'+SITES.map(s=>`<option value="${s.id}">${esc(s.name)}${s.status==='open'?'':' (준비 중)'}</option>`).join('');
    const seasons=[...new Set(SITES.filter(s=>s.season).map(s=>s.season.id))];
    $('fseason').innerHTML='<option value="">모든 시즌</option>'+SITES.filter(s=>s.season).map(s=>`<option value="${s.season.id}">${esc(s.season.name)}</option>`).join('');
    $('fsite').onchange=$('fseason').onchange=render;
  }
  const pick=a=>a.filter(x=>(!$('fsite').value||x.site===$('fsite').value)&&(!$('fseason').value||x.season===$('fseason').value));

  // ---------- 그리기 ----------
  function render(){
    const C=pick(DATA.coupons||[]),E=pick(DATA.entries||[]),P=pick(DATA.plays||[]);
    const used=C.filter(c=>c.usedAt).length,rate=C.length?Math.round(used/C.length*100):0;
    const players=new Set(P.map(p=>p.device).filter(Boolean)).size;
    $('kpis').innerHTML=[
      ['플레이',fmt(P.length),players?`참여 기기 ${fmt(players)}대`:'한 판 끝날 때마다 기록'],
      ['발급 쿠폰',fmt(C.length),'가게를 처음 구했을 때'],
      ['사용 쿠폰',fmt(used),'가게에서 PIN으로 처리'],
      ['쿠폰 사용률',rate+'%','사용 ÷ 발급'],
      ['추첨 응모',fmt(E.length),'스탬프 7개 완성자'],
    ].map(([l,v,s])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

    // 가게별
    const rows=[];for(const s of SITES){if(!s.stores)continue;if($('fsite').value&&$('fsite').value!==s.id)continue;
      for(const st of s.stores){const cs=C.filter(c=>c.site===s.id&&c.store===st.name),u=cs.filter(c=>c.usedAt).length,r=cs.length?u/cs.length:0;
        rows.push(`<tr><td><span class="dot" style="background:${st.color}"></span>${esc(st.name)}</td><td class="muted">${esc(s.name)}</td><td>${esc(st.benefit)}</td>
          <td class="n">${fmt(cs.length)}</td><td class="n">${fmt(u)}</td>
          <td><div class="rate" title="${esc(st.name)} 사용률 ${Math.round(r*100)}% (${fmt(u)}/${fmt(cs.length)})"><span class="track"><i style="width:${r*100}%"></i></span><span>${Math.round(r*100)}%</span></div></td>
          <td><button class="pin" type="button" data-pin="${esc(st.pin)}">PIN 보기</button></td></tr>`)}}
    $('stores').innerHTML=`<thead><tr><th>가게</th><th>명소</th><th>혜택</th><th class="n">발급</th><th class="n">사용</th><th>사용률</th><th>가게 PIN</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="7" class="empty">이 명소에는 아직 참여 가게가 없어요.</td></tr>'}</tbody>`;
    $('stores').querySelectorAll('.pin').forEach(b=>b.onclick=()=>{b.textContent=b.textContent==='PIN 보기'?b.dataset.pin:'PIN 보기'});

    // 응모자
    const mask=s=>UNMASK?s:s.length>=10?`${s.slice(0,3)}-****-${s.slice(-4)}`:'****';
    const nm=n=>UNMASK||n.length<2?n:n[0]+'*'.repeat(Math.max(1,n.length-2))+(n.length>2?n.slice(-1):'');
    const ent=E.slice().sort((a,b)=>a.at<b.at?1:-1);
    $('entries').innerHTML=ent.length?`<thead><tr><th>#</th><th>이름</th><th>연락처</th><th>명소</th><th>응모 시각</th></tr></thead><tbody>${ent.slice(0,MORE?500:15).map((e,i)=>`<tr><td class="muted">${i+1}</td><td>${esc(nm(e.name))}</td><td>${esc(mask(e.phone))}</td><td class="muted">${esc((siteOf(e.site)||{}).name||e.site)}</td><td class="muted">${new Date(e.at).toLocaleString('ko-KR')}</td></tr>`).join('')}</tbody>${ent.length>15?`<tfoot><tr><td colspan="5"><button class="btn small ghost" id="more" type="button">${MORE?'접기':`전체 ${fmt(ent.length)}명 보기`}</button></td></tr></tfoot>`:''}`
      :'<tbody><tr><td class="empty">아직 응모자가 없어요.</td></tr></tbody>';
    const mb=$('more');if(mb)mb.onclick=()=>{MORE=!MORE;render()};
    $('unmask').textContent=UNMASK?'연락처 가리기':'연락처 전체 보기';
    drawView(E,mask,nm);
  }
  // ---------- 쿠폰북 추첨 ----------
  const grandSite=()=>SITES.find(s=>s.grand&&(!$('fsite').value||s.id===$('fsite').value));
  const DKEY=s=>'suhorun.draw.'+s.season.id+(SAMPLE?'.sample':'');
  function drawView(E,mask,nm){
    const gs=grandSite();if(!gs){$('drawInfo').textContent='이 명소에는 쿠폰북 추첨이 없어요.';$('doDraw').disabled=true;$('drawRes').innerHTML='';return}
    $('doDraw').disabled=false;const pool=E.filter(e=>e.site===gs.id&&e.season===gs.season.id);
    $('drawInfo').innerHTML=`<b style="font-family:var(--display);font-weight:400;color:var(--cream)">${esc(gs.grand.name)}</b> · ${esc(gs.grand.desc)} · 응모자 ${fmt(pool.length)}명 중 추첨`;
    if(!$('nWin').value)$('nWin').value=gs.grand.winners;
    let d=null;try{d=JSON.parse(localStorage.getItem(DKEY(gs)))}catch(e){}
    $('clrDraw').hidden=$('csvW').hidden=!d;
    $('drawRes').innerHTML=d?`<p class="sub">${new Date(d.at).toLocaleString('ko-KR')} 추첨 · 당첨 ${d.win.length}명</p><div class="tw" style="margin-top:8px"><table class="tbl"><thead><tr><th>#</th><th>이름</th><th>연락처</th><th>응모 시각</th></tr></thead><tbody>${d.win.map((e,i)=>`<tr><td class="muted">${i+1}</td><td>${esc(nm(e.name))}</td><td>${esc(mask(e.phone))}</td><td class="muted">${new Date(e.at).toLocaleString('ko-KR')}</td></tr>`).join('')}</tbody></table></div>`:'';
    $('doDraw').onclick=()=>{if(!pool.length){$('drawRes').innerHTML='<p class="sub">아직 응모자가 없어요.</p>';return}
      if(d&&!confirmBox())return;const n=Math.max(1,Math.min(pool.length,parseInt($('nWin').value,10)||gs.grand.winners));
      const a=pool.slice(),r=new Uint32Array(a.length);crypto.getRandomValues(r);for(let i=a.length-1;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]]}
      try{localStorage.setItem(DKEY(gs),JSON.stringify({at:new Date().toISOString(),win:a.slice(0,n)}))}catch(e){}render()};
    $('clrDraw').onclick=()=>{try{localStorage.removeItem(DKEY(gs))}catch(e){}render()};
    $('csvW').onclick=()=>{if(d)csv(`${gs.grand.name}_당첨자.csv`,['순번','이름','연락처','응모시각'],d.win.map((e,i)=>[i+1,e.name,e.phone,e.at]))};
  }
  let askAgain=0;function confirmBox(){if(Date.now()-askAgain<4000)return true;askAgain=Date.now();$('drawRes').insertAdjacentHTML('afterbegin','<p class="sub" style="color:#ffb4a2">이미 추첨한 결과가 있어요. 다시 추첨하려면 4초 안에 한 번 더 눌러 주세요.</p>');return false}

  // ---------- CSV ----------
  function csv(name,head,rows){const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
    const blob=new Blob(['﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
  $('csvC').onclick=()=>csv('수호런_쿠폰.csv',['쿠폰번호','명소','시즌','가게','혜택','발급','사용'],pick(DATA.coupons||[]).map(c=>[c.code,(siteOf(c.site)||{}).name||c.site,c.season,c.store,c.benefit,c.issuedAt,c.usedAt||'']));
  $('csvE').onclick=()=>csv('수호런_경품응모.csv',['이름','연락처','명소','시즌','응모시각'],pick(DATA.entries||[]).map(e=>[e.name,e.phone,(siteOf(e.site)||{}).name||e.site,e.season,e.at]));
  $('unmask').onclick=()=>{UNMASK=!UNMASK;render()};

  // ---------- 쿠폰 조회 ----------
  $('lkf').onsubmit=e=>{e.preventDefault();const code=$('lk').value.trim().toUpperCase();const c=(DATA.coupons||[]).find(x=>x.code===code);
    if(!c){$('lres').innerHTML='<span class="muted">해당 번호의 쿠폰이 없어요.</span>';return}
    $('lres').innerHTML=`<b style="font-family:var(--display);font-weight:400">${esc(c.store)}</b> · ${esc(c.benefit)} · ${new Date(c.issuedAt).toLocaleDateString('ko-KR')} 발급 · `+
      (c.usedAt?`<span style="color:#ffb4a2">${new Date(c.usedAt).toLocaleString('ko-KR')} 사용 완료</span>`:'<span style="color:var(--mint)">사용 전</span>')};

  // ---------- 안내 ----------
  function how(){
    $('how').innerHTML=W.endpoint
      ?`<b>운영 서버 연결됨</b><br>모든 휴대폰의 쿠폰 발급·사용과 응모가 구글 시트에 모이고, 이 화면은 그 기록을 보여 줘요.`
      :`<b>지금은 시연 모드예요.</b> 쿠폰과 응모 기록이 각 휴대폰 안에만 저장돼서, 이 화면에는 <b>이 기기</b>에서 생긴 기록만 보여요.
        <ol><li>구글 시트를 하나 만들고 <code>server/apps-script.gs</code> 코드를 붙여 넣어 웹 앱으로 배포해요. (무료)</li>
        <li>배포 주소를 <code>common/sites.js</code>의 <code>endpoint</code>에 넣어요.</li>
        <li>그때부터 모든 참여자의 쿠폰·응모가 시트 한곳에 모이고, 가게 PIN 확인도 서버에서 해요.</li></ol>`;
  }

  function refresh(){load().then(d=>{DATA=d;
    if(SAMPLE)note('시연용 샘플 데이터를 보여 주는 중이에요. 실제 기록이 아니에요.','sample');
    else if(!W.endpoint)note('시연 모드 · 이 기기(브라우저)에 저장된 기록만 보여요.','local');else note('');
    render()})}
  function init(){initFilters();how();refresh();
    $('reload').onclick=refresh;
    $('sample').onclick=()=>{SAMPLE=!SAMPLE;$('sample').textContent=SAMPLE?'실제 기록 보기':'시연용 샘플 데이터 보기';refresh()}}
})();
</script>
</body>
</html>
